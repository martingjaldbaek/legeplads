<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legeplads">
<meta name="theme-color" content="#ffe9c7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<title>Legeplads</title>
</head>
<body>
<main id="home">
  <h1>Legeplads</h1>
  <div id="tiles"></div>
  <div id="info">
    <p id="hint"></p>
    <p id="version"></p>
  </div>
</main>

<div id="stage"></div>

<!-- Parent gate: hold for 1.5 s to leave a game -->
<button id="gate" aria-label="Tilbage til menuen">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <circle class="track" cx="24" cy="24" r="20"/>
    <circle class="ring" cx="24" cy="24" r="20"/>
    <path class="house" d="M15 24 L24 15 L33 24 M18 22 V33 H30 V22"/>
  </svg>
</button>

<script type="module" src="js/app.js"></script>
</body>
</html>
